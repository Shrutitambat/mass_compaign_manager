{% extends 'campaigns/base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card card-custom p-4 bg-white">
            <h4 class="fw-bold mb-3">{{ title }}</h4>
            <div class="alert alert-info py-2 small">
                <i class="bi bi-info-circle me-1"></i> Use <code>&#123;&#123;name&#125;&#125;</code> in your body text to dynamically inject the subscriber's name.
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Template Title</label>
                    {{ form.title }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Subject Line</label>
                    {{ form.subject }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Body Content</label>
                    {{ form.body }}
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'template_list' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Template</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
