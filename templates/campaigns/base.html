<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Campaign Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #0f172a; color: #fff; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 10px 15px; display: block; border-radius: 6px; }
        .sidebar a:hover, .sidebar a.active { background-color: #1e293b; color: #fff; }
        .card-custom { border: none; border-radius: 10px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            {% if user.is_authenticated %}
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
                <div class="d-flex align-items-center mb-4 ps-2">
                    <i class="bi bi-send-fill fs-4 text-primary me-2"></i>
                    <span class="fs-5 fw-bold text-white">Campaigner</span>
                </div>
                <hr class="text-secondary">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'contact_lists' %}" class="{% if 'list' in request.resolver_match.url_name and 'template' not in request.resolver_match.url_name and 'campaign' not in request.resolver_match.url_name %}active{% endif %}">
                            <i class="bi bi-people me-2"></i> Contact Lists
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'template_list' %}" class="{% if 'template' in request.resolver_match.url_name %}active{% endif %}">
                            <i class="bi bi-file-earmark-text me-2"></i> Email Templates
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'campaign_list' %}" class="{% if 'campaign' in request.resolver_match.url_name %}active{% endif %}">
                            <i class="bi bi-megaphone me-2"></i> Campaigns
                        </a>
                    </li>
                </ul>
                <hr class="text-secondary">
                <div class="px-2">
                    <small class="text-muted d-block mb-2">Signed in as <strong>{{ user.username }}</strong></small>
                    <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm w-100 text-center"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                </div>
            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            {% else %}
            <main class="col-12 py-5">
            {% endif %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
