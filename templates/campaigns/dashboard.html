{% extends 'campaigns/base.html' %}
{% block title %}Dashboard - Campaign Manager{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-0">Dashboard Overview</h2>
        <p class="text-muted">Welcome back, {{ user.username }}</p>
    </div>
    <a href="{% url 'contact_lists' %}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Manage Lists</a>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card card-custom p-4 bg-white">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-muted fw-semibold">Total Contact Lists</span>
                    <h1 class="display-5 fw-bold text-dark mt-2 mb-0">{{ total_lists }}</h1>
                </div>
                <div class="bg-primary bg-opacity-10 p-3 rounded-circle">
                    <i class="bi bi-folder2-open fs-2 text-primary"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card card-custom p-4 bg-white">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-muted fw-semibold">Total Subscribers</span>
                    <h1 class="display-5 fw-bold text-dark mt-2 mb-0">{{ total_subscribers }}</h1>
                </div>
                <div class="bg-success bg-opacity-10 p-3 rounded-circle">
                    <i class="bi bi-people-fill fs-2 text-success"></i>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
