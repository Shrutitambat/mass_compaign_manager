{% extends 'campaigns/base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-custom p-4 bg-white">
            <h4 class="fw-bold mb-4">{{ title }}</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Campaign Name</label>
                    {{ form.name }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Target Contact List (WHO)</label>
                    {{ form.contact_list }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Template (WHAT)</label>
                    {{ form.template }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Status</label>
                    {{ form.status }}
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'campaign_list' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Campaign</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
