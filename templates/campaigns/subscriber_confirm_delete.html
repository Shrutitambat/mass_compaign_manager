{% extends 'campaigns/base.html' %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card card-custom p-4 bg-white text-center">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle fs-1"></i>
            </div>
            <h4 class="fw-bold">Delete {{ type }}?</h4>
            <p class="text-muted">Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.</p>
            <form method="post" class="mt-4">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="javascript:history.back()" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Delete Permanently</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
